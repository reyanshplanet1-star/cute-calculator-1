<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8ddea">
    <link rel="manifest" href="manifest.json">

    <title>🌸 Cute Calculator</title>

    <style>
        body {
            background: #ffeaf4;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .calculator {
            background: #fff7fb;
            padding: 25px;
            border-radius: 25px;
            width: min(300px, 80vw);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #8b4d70;
        }

        #display {
            width: 100%;
            height: 65px;
            box-sizing: border-box;
            border: none;
            border-radius: 15px;
            background: white;
            text-align: right;
            padding: 10px;
            font-size: 30px;
            color: #593b4d;
            margin-bottom: 15px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 55px;
            border: none;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            background: white;
            color: #65485a;
        }

        button:hover {
            background: #f8ddea;
        }

        .operator {
            background: #f6cfe1;
        }

        .clear {
            background: #eadbe6;
        }

        .equal {
            background: #ccebd5;
        }
    </style>
</head>

<body>

<div class="calculator">
    <h2>🌸 Cute Calculator 🌸</h2>

    <input type="text" id="display" value="0" readonly>

    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">AC</button>
        <button class="clear" onclick="backspace()">⌫</button>
        <button class="operator" onclick="add('%')">%</button>
        <button class="operator" onclick="add('/')">÷</button>

        <button onclick="add('7')">7</button>
        <button onclick="add('8')">8</button>
        <button onclick="add('9')">9</button>
        <button class="operator" onclick="add('*')">×</button>

        <button onclick="add('4')">4</button>
        <button onclick="add('5')">5</button>
        <button onclick="add('6')">6</button>
        <button class="operator" onclick="add('-')">−</button>

        <button onclick="add('1')">1</button>
        <button onclick="add('2')">2</button>
        <button onclick="add('3')">3</button>
        <button class="operator" onclick="add('+')">+</button>

        <button onclick="add('0')">0</button>
        <button onclick="add('00')">00</button>
        <button onclick="add('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
const display = document.getElementById("display");

function add(value) {
    if (display.value === "0") {
        display.value = value;
    } else {
        display.value += value;
    }
}

function clearDisplay() {
    display.value = "0";
}

function backspace() {
    display.value = display.value.slice(0, -1);

    if (display.value === "") {
        display.value = "0";
    }
}

function calculate() {
    try {
        display.value = eval(display.value);
    } catch {
        display.value = "Error";
    }
}

if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
